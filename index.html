<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="拼音小达人" />
  <meta name="description" content="给小朋友的汉语拼音学习工具" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>拼音小达人</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="app-header">
    <div class="app-title"><span class="logo">📖</span> 拼音小达人</div>
    <div class="header-right">
      <button class="profile-btn" id="profile-btn" aria-label="切换账号"></button>
      <span class="header-star">⭐ <span id="header-stars">0</span></span>
      <span class="header-star">🏆 <span id="header-trophies">0</span></span>
    </div>
  </header>

  <!-- 顶部次级 tab:错题本入口 -->
  <div class="top-tabs">
    <button class="top-tab" id="top-tab-mistakes" data-view="mistakes">
      📕 错题本 <span class="tab-badge" id="mistakes-badge" hidden>0</span>
    </button>
  </div>

  <!-- 账号切换弹层 -->
  <div class="profile-sheet" id="profile-sheet" hidden>
    <div class="profile-sheet-mask" data-close="1"></div>
    <div class="profile-sheet-body">
      <div class="profile-sheet-title">选择账号</div>
      <div class="profile-list" id="profile-list"></div>
      <button class="ghost-btn" data-close="1">取消</button>
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="main" id="main"></main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-view="learn">
      <span class="nav-icon">📚</span>学习
    </button>
    <button class="nav-item" data-view="practice">
      <span class="nav-icon">🎮</span>练习
    </button>
    <button class="nav-item" data-view="checkin">
      <span class="nav-icon">📅</span>打卡
    </button>
    <button class="nav-item" data-view="parents">
      <span class="nav-icon">👨‍👩‍👦</span>家长
    </button>
  </nav>

  <script src="js/pinyin-data.js?v=17"></script>
  <script src="js/tts.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
  <script src="js/learn.js?v=17"></script>
  <script src="js/practice.js?v=17"></script>
  <script src="js/checkin.js?v=17"></script>
  <script src="js/parents.js?v=17"></script>
  <script src="js/mistakes.js?v=17"></script>
  <script>
    // 应用启动：路由 + 渲染
    const main = document.getElementById("main");
    const navItems = document.querySelectorAll(".nav-item");
    let currentView = "learn";

    function renderHeader() {
      document.getElementById("header-stars").textContent = App.state.stars;
      document.getElementById("header-trophies").textContent = App.state.trophies;
      const p = App.getCurrentProfile();
      const btn = document.getElementById("profile-btn");
      btn.innerHTML = `${p.icon} ${p.label} <span class="chev">▾</span>`;
      btn.classList.toggle("is-test", p.id === "test");
      document.body.classList.toggle("profile-test", p.id === "test");
      // 更新错题本 badge
      const n = App.mistakesCount();
      const badge = document.getElementById("mistakes-badge");
      if (n > 0) {
        badge.textContent = n;
        badge.hidden = false;
        // 数字变动时短暂放大提示
        badge.classList.remove("bump");
        void badge.offsetWidth;
        badge.classList.add("bump");
      } else {
        badge.hidden = true;
      }
      // 高亮当前 tab
      const topTab = document.getElementById("top-tab-mistakes");
      topTab.classList.toggle("active", currentView === "mistakes");
    }
    // 暴露到 window,供各视图作为兜底直接调用
    window.renderAppHeader = renderHeader;

    function renderView(view) {
      // 切视图先停掉可能还在播的音频
      if (window.PinyinTTS && PinyinTTS.stop) PinyinTTS.stop();
      currentView = view;
      navItems.forEach((n) => n.classList.toggle("active", n.dataset.view === view));
      switch (view) {
        case "learn":
          main.innerHTML = '<div class="view-title">🔤 学一学</div>';
          Learn.render(main);
          break;
        case "practice":
          main.innerHTML = '<div class="view-title">🎮 练一练</div>';
          Practice.render(main);
          break;
        case "checkin":
          Checkin.render(main);
          break;
        case "parents":
          Parents.render(main);
          break;
        case "mistakes":
          Mistakes.render(main);
          break;
      }
      renderHeader();
    }

    navItems.forEach((n) => {
      n.addEventListener("click", () => renderView(n.dataset.view));
    });

    // 顶部错题本 tab
    document.getElementById("top-tab-mistakes").addEventListener("click", () => renderView("mistakes"));

    // ---------- 账号切换 UI ----------
    const sheet = document.getElementById("profile-sheet");
    const profileList = document.getElementById("profile-list");
    function openProfileSheet() {
      const cur = App.getCurrentProfile().id;
      profileList.innerHTML = App.listProfiles().map((p) => `
        <button class="profile-item ${p.id === cur ? "current" : ""}" data-id="${p.id}">
          <span class="profile-icon">${p.icon}</span>
          <span class="profile-label">${p.label}${p.id === "test" ? "<small>数据独立,不影响正式记录</small>" : "<small>日常学习记录</small>"}</span>
          ${p.id === cur ? '<span class="profile-current">当前</span>' : ""}
        </button>
      `).join("");
      sheet.hidden = false;
    }
    function closeProfileSheet() { sheet.hidden = true; }
    document.getElementById("profile-btn").addEventListener("click", openProfileSheet);
    sheet.addEventListener("click", (e) => {
      if (e.target.dataset.close) return closeProfileSheet();
      const item = e.target.closest(".profile-item");
      if (item) {
        App.switchProfile(item.dataset.id);
        closeProfileSheet();
      }
    });
    document.addEventListener("app:profile-changed", () => renderView(currentView));
    // 任意状态变化(如答题)后刷新顶栏 badge / 星星 / 奖杯
    document.addEventListener("app:state-changed", renderHeader);

    // 初始渲染
    renderView("learn");

    // 注册 service worker(离线)+ 自动检测新版本并静默刷新
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // 页面加载时主动 check 一次
          reg.update().catch(() => {});
          // 新 SW 被发现时,监听它进入 installed(有旧 SW 时说明是"等待更新")
          reg.addEventListener("updatefound", () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener("statechange", () => {
              if (newSW.state === "installed" && navigator.serviceWorker.controller) {
                // 有旧 SW 在跑说明是"新版等激活",让它立即接管
                newSW.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });
        }).catch(() => {});
        // 新 SW 接管后自动 reload,页面切到最新版
        let reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }

    // 首次交互唤醒 TTS
    document.addEventListener("touchstart", function wake() {
      PinyinTTS.init();
      document.removeEventListener("touchstart", wake);
    }, { once: true });
  </script>
</body>
</html>
